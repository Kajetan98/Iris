[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.1.0"
description = "IRIS: asystent głosowy (host)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "httpx>=0.27",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# STT (faster-whisper) i TTS (Piper); av i numpy ciągną się za nimi, ale host.brain importuje je wprost.
# Uwaga: piper-tts ma licencję GPL-3.0-or-later.
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.3",
    "av>=12",
    "numpy>=1.26",
]
# Program na komputer i Raspberry Pi (client/). sounddevice wymaga systemowej biblioteki PortAudio
# (Debian, Ubuntu, Raspberry Pi OS: apt install libportaudio2).
desktop = [
    "sounddevice>=0.4",
    "av>=12",
    "numpy>=1.26",
]

# W katalogu głównym jest kilka pakietów (host, client, sim) i katalogi bez Pythona (firmware, docs),
# więc pakiety są wskazane jawnie. Testy nie są instalowane.
[tool.setuptools.packages.find]
include = ["host*", "client*", "sim*"]
exclude = ["host.tests*"]

[tool.setuptools.package-data]
"host.api" = ["static/*"]  # klient w przeglądarce

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["host/tests"]
