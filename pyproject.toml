[project]
name = "iris"
version = "0.1.0"
description = "IRIS: asystent głosowy (host)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# STT (faster-whisper) i TTS (Piper); av i numpy ciągną się za nimi, ale host.brain importuje je wprost.
# Uwaga: piper-tts ma licencję GPL-3.0-or-later.
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.3",
    "av>=12",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["host/tests"]
