[project]
name = "iris"
version = "0.1.0"
description = "IRIS: asystent głosowy (host)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["host/tests"]
