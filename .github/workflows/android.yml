# Testy rdzenia aplikacji Android (android/core, Kotlin/JVM, bez Androida; docs/spec.md, sekcja 14).
# Zgodność z hostem pilnuje wspólny plik android/core/src/test/resources/learning_vectors.json.
name: android

on:
  push:
    paths:
      - "android/**"
      - "host/core/learning.py"
      - "host/brain/learn.py"
      - "host/brain/prompt.py"
      - "host/tests/make_android_vectors.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "host/core/learning.py"
      - "host/brain/learn.py"
      - "host/brain/prompt.py"
      - "host/tests/make_android_vectors.py"
      - ".github/workflows/android.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy rdzenia
        run: ./gradlew :core:test --no-daemon
